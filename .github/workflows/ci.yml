name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning bin/maxwell-linux bin/maxwell-linux-report install.sh
      - name: Python syntax
        run: python3 -m py_compile gui/maxwell-linux-gui
      - name: Validate desktop file
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils
          sed "s|@BIN@|/usr/bin|" gui/io.github.maxwell_linux.desktop.in > /tmp/m.desktop && desktop-file-validate /tmp/m.desktop
