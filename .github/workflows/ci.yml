name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning bin/tuxwell bin/tuxwell-report bin/tuxwell-hrtf install.sh
      - name: Python syntax
        run: python3 -m py_compile gui/tuxwell-gui bin/tuxwell-test-sound bin/tuxwell-render-surround tools/fit-eq.py
      - name: Validate desktop file
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils
          sed "s|@BIN@|/usr/bin|" gui/io.github.omniscipotent.Tuxwell.desktop.in > /tmp/m.desktop && desktop-file-validate /tmp/m.desktop
